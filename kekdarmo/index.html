let YT=null,YX=0;
const ytTok=()=>new Promise((ok,no)=>{if(YT&&Date.now()<YX)return ok(YT);
 if(location.protocol==='file:')return no(new Error('Login Google tidak jalan dari file://. Buka lewat http(s) yang origin-nya terdaftar di Client ID.'));
 if(!window.google||!google.accounts)return no(new Error('Pustaka Google Sign-In belum termuat (cek internet).'));
 google.accounts.oauth2.initTokenClient({client_id:CFG.cid,scope:'https://www.googleapis.com/auth/youtube.upload',callback:r=>{if(r.error)return no(new Error('Login ditolak: '+(r.error_description||r.error)));YT=r.access_token;YX=Date.now()+(r.expires_in-60)*1000;ok(YT)},error_callback:e=>no(new Error('Popup login gagal ('+(e.type||'error')+')'))}).requestAccessToken({prompt:''})});
const xr=(m,u,h,b,pg)=>new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open(m,u);for(const k in h)x.setRequestHeader(k,h[k]);if(pg)x.upload.onprogress=pg;x.onload=()=>ok(x);x.onerror=()=>no(new Error('jaringan terputus'));x.send(b||null)});
$('yu').onclick=async()=>{save();if(!LASTV){st('Rekam video dulu (tombol Rekam video).');return}
 if(TOT>120.5){st('Durasi '+TOT.toFixed(0)+' dtk melebihi batas 2 menit.');return}
 $('yu').disabled=true;try{const tok=await ytTok(),bl=LASTV.bl,sz=bl.size,tags=$('yg').value.split(',').map(s=>s.trim()).filter(Boolean);
  let x=await xr('POST','https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status',{'Authorization':'Bearer '+tok,'Content-Type':'application/json; charset=UTF-8','X-Upload-Content-Length':String(sz),'X-Upload-Content-Type':'video/'+LASTV.ext},JSON.stringify({snippet:{title:($('yt').value||'Kekdarmo Ep.'+EP.no).slice(0,100),description:$('yd').value,tags,categoryId:'27',defaultLanguage:'id'},status:{privacyStatus:CFG.pv,selfDeclaredMadeForKids:$('mk').value=='1'}}));
  if(x.status!==200)throw new Error('Gagal memulai upload (HTTP '+x.status+': '+x.responseText.slice(0,150)+')');
  const loc=x.getResponseHeader('Location'),C=8<<20;let off=0,fail=0;
  while(off<sz){const end=Math.min(off+C,sz),o0=off;
   try{x=await xr('PUT',loc,{'Content-Range':'bytes '+off+'-'+(end-1)+'/'+sz},bl.slice(off,end),e=>st('Mengunggah '+Math.floor((o0+e.loaded)/sz*100)+'%'))}catch(e){x={status:0,getResponseHeader:()=>null}}
   if(x.status==200||x.status==201){const id=JSON.parse(x.responseText).id;st('Terunggah ('+CFG.pv+'): https://youtu.be/'+id);EPS.forEach(e=>delete e.d);svE();showE();$('yu').disabled=false;return}
   if(x.status==308){fail=0;const m=/bytes=0-(\d+)/.exec(x.getResponseHeader('Range')||'');off=m?+m[1]+1:end;continue}
   if(++fail>6)throw new Error('Upload gagal berulang (HTTP '+x.status+')');
   await new Promise(z=>setTimeout(z,2000*fail));const q=await xr('PUT',loc,{'Content-Range':'bytes */'+sz}).catch(()=>({status:0}));
   if(q.status==308){const m=/bytes=0-(\d+)/.exec(q.getResponseHeader('Range')||'');off=m?+m[1]+1:0}}}
 catch(e){st('Upload gagal: '+(e.message||e))}$('yu').disabled=false};

const SUBC={bima:'#ff8a7a',sari:'#ff9ed2',kakek:'#7be0a8'},SM=['pop','box','off'],SN={pop:'Pop',box:'Kotak',off:'Mati'};

const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h)};
function subs(L,ls,dur){const m=CFG.sub;if(m=='off')return;
 const ws=L[1].split(' '),wk=cl(ls/dur)*ws.length,ci=Math.min(ws.length-1,Math.floor(wk)),pop=m!='box',CS=pop?4:99,c0=Math.floor(ci/CS)*CS,seg=ws.slice(c0,c0+CS),fs=pop?68:40,lh=fs*1.3;
 g.font='900 '+fs+'px system-ui,sans-serif';const lines=[];let cur=[];
 seg.forEach((w,i)=>{if(cur.length&&g.measureText(cur.map(q=>q.w).concat(w).join(' ')).width>W-110){lines.push(cur);cur=[]}cur.push({w,i:c0+i})});lines.push(cur);
 const y0=pop?H*.62:H-150-lines.length*lh,py=y0-fs-30;
 if(!pop){g.fillStyle='rgba(8,16,22,.62)';rr(28,py-12,W-56,lines.length*lh+98,26);g.fill()}
 g.font='800 30px system-ui,sans-serif';g.textAlign='center';const nw=g.measureText(NM[L[0]]).width+44;g.fillStyle=SUBC[L[0]];rr(W/2-nw/2,py,nw,46,23);g.fill();g.fillStyle='#10141a';g.fillText(NM[L[0]],W/2,py+33);
 g.textAlign='left';g.lineJoin='round';g.font='900 '+fs+'px system-ui,sans-serif';
 lines.forEach((ln,n)=>{const tw=g.measureText(ln.map(q=>q.w).join(' ')).width;let x=W/2-tw/2;const y=y0+n*lh;
  ln.forEach(q=>{const cw=g.measureText(q.w).width,on=q.i==ci,k=pop&&on?1+.18*Math.max(0,1-(wk-ci)*5):1;g.save();g.translate(x+cw/2,y-fs*.3);g.scale(k,k);
   if(pop){g.lineWidth=fs*.24;g.strokeStyle='#000';g.strokeText(q.w,-cw/2,fs*.3)}
   g.fillStyle=pop?(on?'#ffe14a':'#fff'):(q.i<=ci?'#ffe27a':'rgba(255,255,255,.55)');g.fillText(q.w,-cw/2,fs*.3);g.restore();x+=g.measureText(q.w+' ').width})});
 g.textAlign='center'}

let play=false,base=0,srcs=[],rec=null;
function stop(){play=false;srcs.forEach(s=>{try{s.stop()}catch(e){}});srcs=[]}
async function run(record){
 if(record&&TOT>120.5){st('Durasi '+TOT.toFixed(0)+' dtk melebihi batas 2 menit. Pendekkan dialog.');return}stop();const a=ctx();await a.resume();reset();base=a.currentTime+.4;
 BUF.forEach((b,i)=>{if(!b)return;const s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.connect(DEST);s.start(base+ST[i]+.1);srcs.push(s)});
 if(record){if(!window.MediaRecorder){st('Browser tidak mendukung perekaman.');return}
  const mt=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const ms=new MediaStream([...cv.captureStream(30).getVideoTracks(),...DEST.stream.getAudioTracks()]),ch=[];
  rec=new MediaRecorder(ms,mt?{mimeType:mt,videoBitsPerSecond:5e6}:{videoBitsPerSecond:5e6});
  rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  rec.onstop=()=>{const ext=(rec.mimeType||'').includes('mp4')?'mp4':'webm',bl=new Blob(ch,{type:rec.mimeType}),u=URL.createObjectURL(bl);LASTV={bl,ext};
   const l=document.createElement('a');l.href=u;l.download='kekdarmo-ep'+EP.no+'.'+ext;l.click();st('Video tersimpan: kekdarmo-ep'+EP.no+'.'+ext+(BUF.length?'':' (tanpa suara, siapkan suara dulu)'))};rec.start()}
 play=true}
$('bp').onclick=()=>run(false);$('br').onclick=()=>run(true);
(function loop(){requestAnimationFrame(loop);const A=performance.now()/1000;let t;
 if(play){t=AC.currentTime-base;if(t<0)t=0;if(t>=TOT){play=false;if(rec&&rec.state=='recording')rec.stop();t=TOT-.01;st('Selesai.')}else if(rec&&rec.state=='recording')st('Merekam '+Math.round(t/TOT*100)+'%')}
 else t=.5;
 frame(t,A)})();
